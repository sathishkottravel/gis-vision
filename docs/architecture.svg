<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #333; stroke-width: 1.4; }
      .later { stroke-dasharray: 6 4; }
      .t { fill: #111; font-weight: 600; }
      .s { fill: #555; font-size: 11.5px; }
      .tag { fill: #7a4b00; font-size: 11px; font-weight: 600; }
      .edge { fill: none; stroke: #333; stroke-width: 1.4; marker-end: url(#arrow); }
      .lbl { fill: #444; font-size: 11px; }
    </style>
  </defs>

  <rect x="0" y="0" width="1000" height="660" fill="#ffffff"/>
  <text x="20" y="26" font-size="18" class="t">gis-vision: target architecture</text>

  <!-- AWS -->
  <rect x="200" y="60" width="500" height="500" rx="10" fill="#fff8ee" stroke="#ff9900" stroke-width="1.6"/>
  <text x="214" y="80" class="t" fill="#b36b00">AWS (serverless): deploy/aws, CDK</text>

  <!-- Droplet -->
  <rect x="740" y="60" width="240" height="500" rx="10" fill="#eef4ff" stroke="#0069ff" stroke-width="1.6"/>
  <text x="754" y="80" class="t" fill="#0050c8">DigitalOcean droplet: deploy/droplet</text>

  <!-- Browser -->
  <rect x="20" y="225" width="150" height="110" rx="8" class="box"/>
  <text x="34" y="250" class="t">Browser</text>
  <text x="34" y="270" class="s">React web app</text>
  <text x="34" y="286" class="s">JSON Forms (P3)</text>
  <text x="34" y="302" class="s">MapLibre map (P2)</text>

  <!-- CloudFront + S3 web -->
  <rect x="230" y="92" width="200" height="58" rx="6" class="box"/>
  <text x="242" y="115" class="t">CloudFront + S3</text>
  <text x="242" y="134" class="s">static web hosting</text>

  <!-- S3 captures -->
  <rect x="470" y="92" width="200" height="58" rx="6" class="box"/>
  <text x="482" y="115" class="t">S3 captures bucket</text>
  <text x="482" y="134" class="s">private; presigned PUT / GET</text>

  <!-- API Gateway -->
  <rect x="230" y="250" width="160" height="60" rx="6" class="box"/>
  <text x="242" y="274" class="t">API Gateway</text>
  <text x="242" y="293" class="s">HTTP API</text>

  <!-- API Lambda -->
  <rect x="430" y="225" width="240" height="105" rx="6" class="box"/>
  <text x="442" y="248" class="t">API Lambda (Node/TS)</text>
  <text x="442" y="267" class="s">Fastify REST: captures, detections</text>
  <text x="442" y="283" class="s">GraphQL Yoga + Pothos (P2)</text>
  <text x="442" y="299" class="s">Drizzle | Zod | Ajv</text>
  <text x="442" y="315" class="s">ports: BlobStore, JobQueue, Cache</text>

  <!-- SQS -->
  <rect x="230" y="400" width="180" height="62" rx="6" class="box later"/>
  <text x="242" y="424" class="t">SQS + DLQ</text>
  <text x="242" y="443" class="s">detection jobs, outbox</text>
  <text x="372" y="424" class="tag">P4</text>

  <!-- CV worker -->
  <rect x="450" y="400" width="220" height="62" rx="6" class="box later"/>
  <text x="462" y="424" class="t">CV worker (Python)</text>
  <text x="462" y="443" class="s">ONNX inference, container Lambda</text>
  <text x="640" y="424" class="tag">P5</text>

  <!-- Cache -->
  <rect x="450" y="490" width="220" height="50" rx="6" class="box later"/>
  <text x="462" y="512" class="t">Cache (Redis)</text>
  <text x="462" y="529" class="s">hot queries, vector tiles</text>
  <text x="640" y="512" class="tag">P6</text>

  <!-- Droplet components -->
  <rect x="760" y="225" width="200" height="55" rx="6" class="box"/>
  <text x="772" y="248" class="t">PgBouncer</text>
  <text x="772" y="266" class="s">TLS :6432, transaction pooling</text>

  <rect x="760" y="308" width="200" height="72" rx="6" class="box"/>
  <text x="772" y="331" class="t">PostgreSQL 17 + PostGIS</text>
  <text x="772" y="349" class="s">detections partitioned by month</text>
  <text x="772" y="365" class="s">GiST (geom), BRIN (time)</text>

  <rect x="760" y="402" width="200" height="45" rx="6" class="box"/>
  <text x="772" y="422" class="t">pg_cron</text>
  <text x="772" y="438" class="s">partitions, retention, cleanup</text>

  <rect x="760" y="470" width="200" height="50" rx="6" class="box"/>
  <text x="772" y="491" class="t">pgAdmin 4</text>
  <text x="772" y="508" class="s">geometry viewer, SSH tunnel only</text>
  <text x="760" y="545" class="s">firewall | fail2ban | nightly pg_dump to S3</text>

  <!-- Edges -->
  <path class="edge" d="M95 225 L95 42 L570 42 L570 90"/>
  <text x="250" y="37" class="lbl">image bytes: direct upload with presigned PUT</text>

  <path class="edge" d="M170 245 L190 245 L190 121 L228 121"/>
  <text x="104" y="190" class="lbl">static assets</text>

  <path class="edge" d="M170 280 L228 280"/>
  <text x="173" y="272" class="lbl">REST/GQL</text>

  <path class="edge" d="M390 280 L428 280"/>

  <path class="edge" d="M550 225 L550 152"/>
  <text x="556" y="195" class="lbl">presign, HEAD</text>

  <path class="edge" d="M670 252 L758 252"/>
  <text x="676" y="245" class="lbl">SQL / TLS</text>

  <path class="edge" d="M860 280 L860 306"/>
  <path class="edge" d="M860 402 L860 382"/>

  <path class="edge later" d="M470 330 L470 368 L320 368 L320 398"/>
  <text x="330" y="362" class="lbl">enqueue</text>

  <path class="edge later" d="M410 431 L448 431"/>

  <path class="edge later" d="M610 400 L610 332"/>
  <text x="616" y="372" class="lbl">results</text>

  <!-- Footer -->
  <text x="20" y="590" class="s">Local dev: docker compose (PostGIS + RustFS, LocalStack from P4). Integration tests use Testcontainers. The same ports and adapters run locally and in the cloud.</text>
  <rect x="20" y="608" width="34" height="16" class="box"/>
  <text x="62" y="621" class="s">built in Phases 0 to 2.5</text>
  <rect x="240" y="608" width="34" height="16" class="box later"/>
  <text x="282" y="621" class="s">later phase (tag shows the phase)</text>
  <text x="520" y="621" class="s">Roadmap: docs and openspec/changes/</text>
</svg>
