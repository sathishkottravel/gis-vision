"""
Pixel bounding box in the capture image: top-left corner, width and height.
"""
type BoundingBox {
  h: Float!
  w: Float!
  x: Float!
  y: Float!
}

"""
WGS84 degrees, edges included. `west > east` crosses the antimeridian (west..180 and -180..east).
"""
input BoundingBoxInput {
  east: Float!
  north: Float!
  south: Float!
  west: Float!
}

"""An uploaded image with its capture time and optional location."""
type Capture {
  byteSize: Int!
  capturedAt: DateTime!
  contentType: String!
  createdAt: DateTime!

  """Detections on this capture, ordered by observation time."""
  detections: [Detection!]!
  id: ID!

  """Time-limited download URL; `null` while the capture is `pending`."""
  imageUrl: String
  location: GeoJSONPoint
  status: CaptureStatus!
}

type CaptureConnection {
  edges: [CaptureEdge!]!
  pageInfo: PageInfo!
}

type CaptureEdge {
  node: Capture!
}

"""
Spatial filters use the capture location; captures without one never match.
"""
input CaptureFilter {
  bbox: BoundingBoxInput
}

enum CaptureStatus {
  """Created; the image upload is not verified yet"""
  pending

  """The image is uploaded and verified"""
  ready
}

"""
ISO 8601 date-time with offset, returned in UTC, e.g. 2026-03-01T10:00:00.000Z
"""
scalar DateTime

"""Something a detector found in a capture, located in space and time."""
type Detection {
  attributes: JSON!
  bbox: BoundingBox!
  capture: Capture!
  confidence: Float
  createdAt: DateTime!
  detector: Detector!
  id: ID!
  label: String!

  """Effective location: its own point, else its capture's location."""
  location: GeoJSONPoint
  locationSource: LocationSource!
  observedAt: DateTime!
}

type DetectionConnection {
  edges: [DetectionEdge!]!
  pageInfo: PageInfo!
}

type DetectionEdge {
  node: Detection!
}

"""
All given conditions apply. Spatial filters use the effective location; at most one of `bbox` and `near`.
"""
input DetectionFilter {
  bbox: BoundingBoxInput
  detectorId: ID
  near: NearInput
}

"""
Records detections on captures and declares the JSON Schema of their attributes.
"""
type Detector {
  """Slug, e.g. `manual`"""
  id: ID!
  kind: DetectorKind!
  name: String!

  """JSON Schema (supported subset) for the `attributes` of its detections"""
  outputSchema: JSON!
  version: Int!
}

enum DetectorKind {
  """A human annotating captures"""
  manual

  """An automated model"""
  ml
}

"""
GeoJSON Point in WGS84: { "type": "Point", "coordinates": [longitude, latitude] }
"""
scalar GeoJSONPoint

"""Any JSON value, e.g. detection attributes or a detector output schema"""
scalar JSON

"""Where a detection's effective `location` comes from."""
enum LocationSource {
  """Its capture's location (the detection has no own point)"""
  CAPTURE

  """The detection's own point"""
  DETECTION

  """Neither the detection nor its capture has a location"""
  NONE
}

"""
Geodesic distance from `center` in meters, boundary included (at most 50,000).
"""
input NearInput {
  center: GeoJSONPoint!
  radiusMeters: Float!
}

"""Where a page ends (forward pagination only)."""
type PageInfo {
  hasNextPage: Boolean!
}

type Query {
  """A capture by id; `null` if it does not exist or the id is not a UUID."""
  capture(id: ID!): Capture

  """Captures matching the filter, newest first."""
  captures(
    filter: CaptureFilter

    """Page size, 1-100 (default 50)."""
    first: Int
  ): CaptureConnection!

  """Detections matching the filter, ordered by observation time, then id."""
  detections(
    filter: DetectionFilter

    """Page size, 1-100 (default 50)."""
    first: Int
  ): DetectionConnection!

  """A detector by id; `null` if it does not exist."""
  detector(id: ID!): Detector

  """Every registered detector, ordered by id."""
  detectors: [Detector!]!
}
