# Postgres settings for the Deploy v0 droplet (s-1vcpu-1gb, design D1). Replaces the image's
# default file, so everything not set here uses the built-in defaults.

listen_addresses = '*'          # inside the container; the host publishes loopback only
port = 5432
max_connections = 40            # PgBouncer (F2.5.2) multiplexes the API's clients

# Memory for a 1 GB host that also runs PgBouncer (and pgAdmin on demand).
shared_buffers = 128MB
effective_cache_size = 512MB
work_mem = 4MB
maintenance_work_mem = 64MB

# Authentication: SCRAM only (pg_hba.conf never allows md5 or trust).
password_encryption = scram-sha-256

# TLS with the private CA's server certificate (design D4; scripts/make-certs.sh). pg_hba.conf
# accepts network clients only over TLS (hostssl).
ssl = on
ssl_cert_file = '/secrets/postgres/server.crt'
ssl_key_file = '/secrets/postgres/server.key'
ssl_min_protocol_version = 'TLSv1.2'

timezone = 'UTC'
log_timezone = 'UTC'
log_connections = on
log_disconnections = on
log_line_prefix = '%m [%p] %q%u@%d '
