# Client authentication for the Deploy v0 droplet (design D3). First match wins.
# TYPE  DATABASE    USER                              ADDRESS  METHOD

# Bootstrap superuser: only through the container's socket (`docker compose exec -u postgres db psql`).
local   all         postgres                                   peer

# Application roles over the network, SCRAM only. TLS becomes mandatory in F2.5.2 (hostssl).
host    gis_vision  gis_owner,gis_app,gis_readonly    all      scram-sha-256

# Everything else, including the superuser over TCP, is refused.
local   all         all                                        reject
host    all         all                               all      reject
