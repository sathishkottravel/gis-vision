# Client authentication for the Deploy v0 droplet (design D3). First match wins.
# TYPE  DATABASE    USER                              ADDRESS  METHOD

# Bootstrap superuser: only through the container's socket (`docker compose exec -u postgres db psql`).
local   all         postgres                                   peer

# Application roles over the network: TLS (hostssl) and SCRAM only.
hostssl gis_vision  gis_owner,gis_app,gis_readonly    all      scram-sha-256

# Everything else is refused: plaintext connections, other databases, and the superuser over TCP.
local   all         all                                        reject
host    all         all                               all      reject
