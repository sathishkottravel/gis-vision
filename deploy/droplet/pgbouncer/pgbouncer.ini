; PgBouncer for the Deploy v0 droplet (design D5): transaction pooling in front of Postgres,
; TLS on both sides. Mounted over the image's generated config.

[databases]
gis_vision = host=db port=5432 dbname=gis_vision

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

; Clients log in with SCRAM against the server's own verifiers (scripts/make-userlist.sh).
auth_type = scram-sha-256
auth_file = /secrets/pgbouncer/userlist.txt

; One server connection per transaction: the API keeps no session state.
pool_mode = transaction
max_client_conn = 200
default_pool_size = 10
max_db_connections = 20

; poolConfig sends `options` (search_path); PgBouncer would refuse it. The database-level
; search_path from migration 0000 applies to every server connection instead.
ignore_startup_parameters = extra_float_digits, options

; Clients must use TLS; they verify this certificate against the private CA.
client_tls_sslmode = require
client_tls_cert_file = /secrets/pgbouncer/server.crt
client_tls_key_file = /secrets/pgbouncer/server.key
client_tls_protocols = tlsv1.2,tlsv1.3

; To Postgres: TLS, verifying its certificate (SAN `db`) against the same CA.
server_tls_sslmode = verify-full
server_tls_ca_file = /secrets/pgbouncer/ca.crt

; Failed logins are logged with the client address, for fail2ban (F2.5.5).
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
